<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="var(--sans,system-ui),sans-serif">
<text x="12" y="26" font-size="19" font-weight="700" fill="var(--mute,#5b6472)" letter-spacing="1.4">CYCLE ACCOUNTING &#183; rank 120 / node 2</text>
<rect x="12" y="42" width="540" height="46" fill="var(--fill,#eceef2)" rx="4"/>
<rect x="12" y="42" width="340.8" height="46" fill="var(--warn,#b45309)" rx="4"/>
<rect x="12" y="42" width="181.7" height="46" fill="var(--crit,#a4161a)" rx="4"/>
<text x="570" y="64" font-size="22" font-weight="700" fill="var(--crit,#a4161a)" font-family="var(--mono,monospace)">33.6%</text>
<text x="648" y="64" font-size="19" fill="var(--ink,#12151c)">L3-miss stalls</text>
<text x="570" y="90" font-size="22" font-weight="700" fill="var(--warn,#b45309)" font-family="var(--mono,monospace)">63.1%</text>
<text x="648" y="90" font-size="19" fill="var(--ink,#12151c)">total stalls</text>
<text x="12" y="114" font-size="18" fill="var(--mute,#5b6472)">of all cycles &#183; IPC 0.99 (rank 120), 1.03 (rank 24)</text>
<line x1="12" y1="140" x2="888" y2="140" stroke="var(--rule,#dfe3ea)" stroke-width="2"/>
<text x="12" y="176" font-size="19" font-weight="700" fill="var(--mute,#5b6472)" letter-spacing="1.4">SEPARATE METRIC, SEPARATE SCALE &#183; rank 168 / node 3</text>
<text x="12" y="228" font-size="42" font-weight="700" fill="var(--ink,#12151c)" font-family="var(--mono,monospace)">91.4%</text>
<text x="150" y="228" font-size="19" fill="var(--mute,#5b6472)">LLC load miss rate &#8212; not on the same scale as the stall bars</text>
<line x1="12" y1="256" x2="888" y2="256" stroke="var(--rule,#dfe3ea)" stroke-width="2"/>
<text x="12" y="292" font-size="19" font-weight="700" fill="var(--mute,#5b6472)" letter-spacing="1.4">FP ARITHMETIC ELEMENTS BY VECTOR WIDTH &#183; rank 72 / node 1</text>
<rect x="12.0" y="308" width="770.0" height="44" fill="var(--accent,#0b4f9c)"/>
<rect x="782.0" y="308" width="91.9" height="44" fill="var(--accent2,#4a86c8)"/>
<rect x="873.9" y="308" width="14.1" height="44" fill="var(--accent3,#9dc2e6)"/>
<rect x="888.0" y="308" width="3.0" height="44" fill="var(--rule,#dfe3ea)"/>
<text x="12" y="396" font-size="34" font-weight="700" fill="var(--accent,#0b4f9c)" font-family="var(--mono,monospace)">87.9%</text>
<text x="128" y="396" font-size="24" fill="var(--ink,#12151c)">scalar</text>
<text x="240" y="396" font-size="22" fill="var(--ink,#12151c)" font-family="var(--mono,monospace)">10.5% 128-bit &#183; 1.6% 256-bit &#183; 0.0% 512-bit</text>
<text x="12" y="434" font-size="17" fill="var(--mute,#5b6472)">Retired FP arithmetic instruction events weighted by width &#8212; not FLOPs; FMA semantics differ.</text>
<text x="12" y="462" font-size="17" fill="var(--mute,#5b6472)">All four sampled ranks sit at core 24 / socket 1 / NUMA 2 &#8212; no socket 0 or NUMA 0/1 coverage.</text>
<text x="12" y="490" font-size="17" fill="var(--mute,#5b6472)">Each rank carries a different event group; counts are never combined across groups.</text>
</svg>